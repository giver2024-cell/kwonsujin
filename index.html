<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>권수진 · AAIC 포트폴리오 — 시안 비교</title>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  html,body{margin:0;height:100%;background:#EDEAE3}
  #root{height:100vh}
  .ab-frame{width:100%;height:100%;border:0;display:block;background:#fff}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel">
  const { DesignCanvas, DCSection, DCArtboard } = window;

  function Frame({src}){
    return <iframe className="ab-frame" src={src} title={src}></iframe>;
  }

  function App(){
    return (
      <DesignCanvas>
        <DCSection id="portfolio" title="권수진 · AAIC 포트폴리오" subtitle="미니멀 디자인 3방향 — 각 프레임은 실제 스크롤·호버가 동작합니다. 프레임을 더블클릭(포커스)하면 전체화면으로 비교할 수 있어요.">
          <DCArtboard id="editorial" label="A · Editorial — 세리프 / 클레이 포인트" width={1320} height={880}>
            <Frame src="variations/editorial.html" />
          </DCArtboard>
          <DCArtboard id="structured" label="B · Structured — 그리드 / 파인 그린 포인트" width={1320} height={880}>
            <Frame src="variations/structured.html" />
          </DCArtboard>
          <DCArtboard id="warm" label="C · Warm — 휴머니스트 세리프 / 앰버 포인트" width={1320} height={880}>
            <Frame src="variations/warm.html" />
          </DCArtboard>
        </DCSection>
      </DesignCanvas>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
